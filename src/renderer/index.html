<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>聊天</title>
    <link rel="stylesheet" href="../floating-window.css">
    <script>
        // 仅用于确认 preload 是否注入（可选）
        window.addEventListener('DOMContentLoaded', () => {
            if (window.electronAPI) {
                console.log('preload injected:', window.electronAPI.platform);
            }
        });
    </script>
    
</head>
<body>
    <script src="../floating-window.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // 使用 FloatingWindow 的 inline 模式直接挂载到页面
            const fw = window.FloatingWindow.create({
                inline: true,
                mountContainer: document.body,
                width: '100%',
                height: 'auto',
                draggable: false,
                x: null,
                y: null,
                title: 'CK3 助手',
                content: `
                    <div class="chat-container">
                        <div class="chat-mode-toggle" id="chatModeToggle" style="display:flex;gap:8px;align-items:center;margin-bottom:8px;">
                            <button id="modeBoth" class="mode-btn active">BOTH</button>
                            <button id="modeData" class="mode-btn">DATA</button>
                            <button id="modeSuggestion" class="mode-btn">SUGGESTION</button>
                        </div>
                        <div class="chat-tier-toggle" id="chatTierToggle" style="display:flex;gap:8px;align-items:center;margin-bottom:8px;">
                            <button id="tier1" class="tier-btn">1</button>
                            <button id="tier2" class="tier-btn">2</button>
                            <button id="tier3" class="tier-btn">3</button>
                            <button id="tier4" class="tier-btn">4</button>
                        </div>
                        <div class="chat-messages" id="chatMessages">
                            <div class="message assistant-message">
                                <div class="message-content">
                                    <strong>CK3 助手:</strong> 请输入你的问题...
                                </div>
                            </div>
                        </div>
                        <div class="chat-input-container">
                            <div class="input-wrapper">
                                <div id="fixedText" class="chat-fixed-text">我现在在考虑将直辖领地转移到封臣手中，请帮我分析利弊</div>
                                <button id="sendButton" class="send-button">发送</button>
                            </div>
                        </div>
                    </div>
                `,
                onMessageSend: async function(message) {
                    try {
                        const sessionId = (fw && fw.currentConversationId) ? fw.currentConversationId : 'default';
                        if (!window.electronAPI?.chat) return 'IPC not available';
                        // 针对每个会话仅初始化一次
                        if (!window.__ck3_session_inited) window.__ck3_session_inited = {};
                        if (!window.__ck3_session_inited[sessionId]) {
                            await window.electronAPI.chat.newSession(sessionId);
                            window.__ck3_session_inited[sessionId] = true;
                        }
                        const mode = (fw && typeof fw.getReplyMode === 'function') ? fw.getReplyMode() : 'BOTH';
                        const tier = (fw && typeof fw.getReplyTier === 'function') ? fw.getReplyTier() : undefined;
                        const { reply } = await window.electronAPI.chat.send(sessionId, message, mode, tier);
                        // 支持JSON字符串或对象的安全解析，优先中文
                        try {
                            const parsed = typeof reply === 'string' ? JSON.parse(reply) : reply;
                            if (parsed && typeof parsed === 'object') {
                                const text = parsed.text || parsed.reply || parsed.message || '';
                                return text || JSON.stringify(parsed, null, 2);
                            }
                        } catch {}
                        return reply || '(无回复)';
                    } catch (err) {
                        return `IPC 错误: ${err?.message || err}`;
                    }
                },
                onMessageReceive: function(data) {
                    if (!data) return '';
                    if (typeof data === 'string') {
                        try {
                            const obj = JSON.parse(data);
                            return obj.reply || obj.message || data;
                        } catch {}
                        return data;
                    }
                    return data.reply || data.message;
                },
                onError: function(error) {
                    return `连接错误: ${error.message}`;
                }
            });
        });
    </script>
</body>
</html>
